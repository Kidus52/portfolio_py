<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kidus Tigistu | Full Stack Developer & CS Student</title>
    <meta name="description" content="Portfolio of Kidus Tigistu - Full-Stack Developer and Senior Computer Science student at Hilcoe specializing in Python, Flask, JavaScript, and modern database solutions.">
    <meta name="keywords" content="Kidus Tigistu, Software Developer, Full Stack, Python, Flask, JavaScript, Portfolio, Hilcoe, Web Development">
    <meta name="author" content="Kidus Tigistu">

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Kidus Tigistu | Full Stack Software Developer">
    <meta property="og:description" content="Explore full-stack web applications, software systems, and engineering projects crafted with Python, Flask, and JavaScript.">
    <meta property="og:image" content="{{ url_for('static', filename='img/profile.jpg', _external=True) }}">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Kidus Tigistu | Full Stack Software Developer">
    <meta name="twitter:description" content="Explore full-stack web applications, software systems, and engineering projects crafted with Python, Flask, and JavaScript.">
    <meta name="twitter:image" content="{{ url_for('static', filename='img/profile.jpg', _external=True) }}">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
    <link rel="alternate icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Immediate Theme Application Script (Flash-Free) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('portfolio_theme') || 'cyan';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>
<body class="{{ page }}">
    <!-- Reading Scroll Progress Bar -->
    <div id="scrollProgressBar" class="scroll-progress-bar"></div>
    <header class="sticky">
        <nav>
            <a href="/" class="logo">
                <span class="logo-accent">&lt;</span>Kidus<span class="logo-accent">/&gt;</span>
            </a>
            <ul class="nav-links">
                <li><a href="/" class="{% if page == 'home' %}active{% endif %}">Home</a></li>
                <li><a href="/about" class="{% if page == 'about' %}active{% endif %}">About</a></li>
                <li><a href="/projects" class="{% if page == 'projects' %}active{% endif %}">Projects</a></li>
                <li><a href="/contact" class="{% if page == 'contact' %}active{% endif %}">Contact</a></li>
                <li><a href="/contact" class="btn-nav-cta"><i class="fa-solid fa-paper-plane"></i> Hire Me</a></li>
            </ul>

            <div class="nav-actions">
                <!-- Theme Palette Switcher -->
                <div class="theme-switcher-wrapper">
                    <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Customize Color Theme" title="Theme Palette">
                        <i class="fa-solid fa-palette"></i>
                    </button>
                    <div id="themeDropdown" class="theme-dropdown glass-card" aria-hidden="true">
                        <div class="theme-dropdown-header">Accent Glow</div>
                        <div class="theme-options">
                            <button class="theme-opt-btn" data-theme-name="cyan" title="Cyan Glow">
                                <span class="theme-dot dot-cyan"></span>
                                <span class="theme-name">Cyan Glow</span>
                            </button>
                            <button class="theme-opt-btn" data-theme-name="emerald" title="Emerald Matrix">
                                <span class="theme-dot dot-emerald"></span>
                                <span class="theme-name">Emerald Matrix</span>
                            </button>
                            <button class="theme-opt-btn" data-theme-name="purple" title="Purple Synthwave">
                                <span class="theme-dot dot-purple"></span>
                                <span class="theme-name">Purple Synth</span>
                            </button>
                            <button class="theme-opt-btn" data-theme-name="crimson" title="Crimson Red">
                                <span class="theme-dot dot-crimson"></span>
                                <span class="theme-name">Crimson Red</span>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="hamburger" aria-label="Toggle navigation menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="footer-container">
            <p>© 2026 <strong>Kidus Tigistu</strong>. Crafted with passion & code.</p>
            <div class="social-links">
                <a href="https://github.com/Kidus52" target="_blank" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
                <a href="https://www.linkedin.com/in/kidus-tigistu" target="_blank" aria-label="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
                <a href="https://t.me/THEYCALLMESAINTLMAO" target="_blank" aria-label="Telegram"><i class="fa-brands fa-telegram"></i></a>
                <a href="https://www.instagram.com/_____kidus_____" target="_blank" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
                <button class="social-copy-email" id="copyEmailBtn" aria-label="Copy email address" title="Copy email: kidustigistu3410@gmail.com">
                    <i class="fa-solid fa-envelope"></i>
                </button>
            </div>
        </div>
    </footer>

    <!-- Clipboard Toast Notification -->
    <div id="clipboardToast" class="clipboard-toast" role="alert" aria-live="polite">
        <i class="fa-solid fa-circle-check"></i>
        <span>Email copied to clipboard!</span>
    </div>

    <!-- Floating Terminal Launcher Trigger -->
    <button id="terminalLauncher" class="terminal-launcher" aria-label="Open Interactive CLI Terminal" title="Developer Terminal (Ctrl+K or ~)">
        <i class="fa-solid fa-terminal"></i>
        <span class="launcher-tooltip">Terminal CLI <kbd>Ctrl+K</kbd></span>
    </button>

    <!-- Floating Back to Top Button -->
    <button id="backToTop" class="back-to-top" aria-label="Back to top">
        <i class="fa-solid fa-arrow-up"></i>
    </button>

    <!-- Interactive Terminal Modal (KidusOS CLI) -->
    <div id="terminalModal" class="terminal-modal" role="dialog" aria-hidden="true" aria-label="Interactive Developer Terminal">
        <div class="terminal-backdrop" id="terminalBackdrop"></div>
        <div class="terminal-window">
            <div class="terminal-header">
                <div class="terminal-controls">
                    <span class="control-dot dot-close" id="terminalCloseBtn" title="Close Terminal"></span>
                    <span class="control-dot dot-min" id="terminalMinBtn" title="Minimize"></span>
                    <span class="control-dot dot-max" id="terminalMaxBtn" title="Maximize"></span>
                </div>
                <div class="terminal-title">
                    <i class="fa-solid fa-terminal"></i> guest@kidus-portfolio: ~ (KidusOS v1.0)
                </div>
                <div class="terminal-shortcut-hint">ESC / 'exit' to close</div>
            </div>
            <div class="terminal-body" id="terminalBody">
                <div class="terminal-output" id="terminalOutput"></div>
                <div class="terminal-input-row">
                    <span class="terminal-prompt">visitor@kidus:~$</span>
                    <input type="text" id="terminalInput" class="terminal-input" autocomplete="off" spellcheck="false" aria-label="Terminal command input" />
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
