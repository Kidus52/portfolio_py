<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="schedBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1c" />
      <stop offset="50%" stop-color="#0c172a" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>

    <!-- Block Gradients -->
    <linearGradient id="cyanBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="emeraldBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="purpleBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="amberBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="roseBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#be123c" stop-opacity="0.15" />
    </linearGradient>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#schedBg)" />

  <!-- Grid Ambient -->
  <g opacity="0.05" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Top Application Navigation Bar -->
  <rect x="25" y="20" width="750" height="50" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="1" />
  <circle cx="48" cy="45" r="5" fill="#ef4444" />
  <circle cx="64" cy="45" r="5" fill="#f59e0b" />
  <circle cx="80" cy="45" r="5" fill="#10b981" />

  <text x="110" y="50" class="sans" font-size="13" font-weight="700" fill="#f8fafc">CLASS SCHEDULER</text>
  <text x="240" y="50" class="mono" font-size="11" fill="#64748b">| Timetable Optimizer &amp; Conflict Resolver Engine</text>

  <!-- Conflict-Free Badge -->
  <rect x="570" y="31" width="190" height="28" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
  <circle cx="586" cy="45" r="4" fill="#10b981" filter="url(#glowGreen)" />
  <text x="598" y="49" class="mono" font-size="10" font-weight="700" fill="#34d399">0 CONFLICTS DETECTED</text>

  <!-- Main Timetable Container -->
  <rect x="25" y="85" width="750" height="325" rx="10" fill="#0b1324" fill-opacity="0.75" stroke="#1e293b" stroke-width="1" />

  <!-- Calendar Day Headers -->
  <rect x="25" y="85" width="750" height="38" rx="10" fill="#0e172a" stroke="#1e293b" stroke-width="1" />
  <text x="65" y="109" class="mono" font-size="11" font-weight="600" fill="#64748b">TIME</text>
  <text x="180" y="109" class="mono" font-size="11" font-weight="700" fill="#38bdf8">MON</text>
  <text x="315" y="109" class="mono" font-size="11" font-weight="700" fill="#38bdf8">TUE</text>
  <text x="450" y="109" class="mono" font-size="11" font-weight="700" fill="#38bdf8">WED</text>
  <text x="585" y="109" class="mono" font-size="11" font-weight="700" fill="#38bdf8">THU</text>
  <text x="710" y="109" class="mono" font-size="11" font-weight="700" fill="#38bdf8">FRI</text>

  <!-- Horizontal Time Rows -->
  <line x1="25" y1="185" x2="775" y2="185" stroke="#1e293b" stroke-width="1" />
  <line x1="25" y1="245" x2="775" y2="245" stroke="#1e293b" stroke-width="1" />
  <line x1="25" y1="305" x2="775" y2="305" stroke="#1e293b" stroke-width="1" />
  <line x1="25" y1="365" x2="775" y2="365" stroke="#1e293b" stroke-width="1" />

  <!-- Vertical Day Separators -->
  <line x1="115" y1="85" x2="115" y2="410" stroke="#1e293b" stroke-width="1" />
  <line x1="250" y1="85" x2="250" y2="410" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="385" y1="85" x2="385" y2="410" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="520" y1="85" x2="520" y2="410" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="655" y1="85" x2="655" y2="410" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2" />

  <!-- Time Labels -->
  <text x="40" y="155" class="mono" font-size="10" fill="#94a3b8">08:30 AM</text>
  <text x="40" y="215" class="mono" font-size="10" fill="#94a3b8">10:30 AM</text>
  <text x="40" y="275" class="mono" font-size="10" fill="#94a3b8">01:30 PM</text>
  <text x="40" y="335" class="mono" font-size="10" fill="#94a3b8">03:30 PM</text>
  <text x="40" y="395" class="mono" font-size="10" fill="#94a3b8">05:00 PM</text>

  <!-- Course Block 1: Mon 08:30 (Cyan) -->
  <rect x="122" y="130" width="120" height="50" rx="6" fill="url(#cyanBlock)" stroke="#06b6d4" stroke-width="1" />
  <text x="130" y="148" class="sans" font-size="10" font-weight="700" fill="#e0f2fe">Database Systems</text>
  <text x="130" y="162" class="mono" font-size="9" fill="#06b6d4">Lab B-204</text>
  <rect x="195" y="152" width="40" height="15" rx="3" fill="#06b6d4" fill-opacity="0.2" />
  <text x="215" y="163" class="mono" font-size="8" fill="#38bdf8" text-anchor="middle">CS-411</text>

  <!-- Course Block 2: Mon 01:30 (Purple) -->
  <rect x="122" y="252" width="120" height="50" rx="6" fill="url(#purpleBlock)" stroke="#8b5cf6" stroke-width="1" />
  <text x="130" y="270" class="sans" font-size="10" font-weight="700" fill="#f3e8ff">Network Security</text>
  <text x="130" y="284" class="mono" font-size="9" fill="#c084fc">Lecture Hall 1</text>
  <rect x="195" y="274" width="40" height="15" rx="3" fill="#8b5cf6" fill-opacity="0.2" />
  <text x="215" y="285" class="mono" font-size="8" fill="#c084fc" text-anchor="middle">CS-414</text>

  <!-- Course Block 3: Tue 10:30 (Emerald) -->
  <rect x="257" y="190" width="120" height="50" rx="6" fill="url(#emeraldBlock)" stroke="#10b981" stroke-width="1" />
  <text x="265" y="208" class="sans" font-size="10" font-weight="700" fill="#d1fae5">Web Engineering</text>
  <text x="265" y="222" class="mono" font-size="9" fill="#34d399">Room C-102</text>
  <rect x="330" y="212" width="40" height="15" rx="3" fill="#10b981" fill-opacity="0.2" />
  <text x="350" y="223" class="mono" font-size="8" fill="#34d399" text-anchor="middle">CS-322</text>

  <!-- Course Block 4: Wed 08:30 (Rose) -->
  <rect x="392" y="130" width="120" height="50" rx="6" fill="url(#roseBlock)" stroke="#f43f5e" stroke-width="1" />
  <text x="400" y="148" class="sans" font-size="10" font-weight="700" fill="#ffe4e6">Operating Systems</text>
  <text x="400" y="162" class="mono" font-size="9" fill="#fb7185">Lab A-105</text>
  <rect x="465" y="152" width="40" height="15" rx="3" fill="#f43f5e" fill-opacity="0.2" />
  <text x="485" y="163" class="mono" font-size="8" fill="#fb7185" text-anchor="middle">CS-310</text>

  <!-- Course Block 5: Wed 03:30 (Cyan) -->
  <rect x="392" y="312" width="120" height="50" rx="6" fill="url(#cyanBlock)" stroke="#06b6d4" stroke-width="1" />
  <text x="400" y="330" class="sans" font-size="10" font-weight="700" fill="#e0f2fe">Distributed Cloud</text>
  <text x="400" y="344" class="mono" font-size="9" fill="#06b6d4">Server Room</text>
  <rect x="465" y="334" width="40" height="15" rx="3" fill="#06b6d4" fill-opacity="0.2" />
  <text x="485" y="345" class="mono" font-size="8" fill="#38bdf8" text-anchor="middle">CS-452</text>

  <!-- Course Block 6: Thu 10:30 (Amber) -->
  <rect x="527" y="190" width="120" height="50" rx="6" fill="url(#amberBlock)" stroke="#f59e0b" stroke-width="1" />
  <text x="535" y="208" class="sans" font-size="10" font-weight="700" fill="#fef3c7">Software Capstone</text>
  <text x="535" y="222" class="mono" font-size="9" fill="#fbbf24">Innovation Hall</text>
  <rect x="600" y="212" width="40" height="15" rx="3" fill="#f59e0b" fill-opacity="0.2" />
  <text x="620" y="223" class="mono" font-size="8" fill="#fbbf24" text-anchor="middle">CS-499</text>

  <!-- Course Block 7: Fri 08:30 (Emerald) -->
  <rect x="662" y="130" width="105" height="50" rx="6" fill="url(#emeraldBlock)" stroke="#10b981" stroke-width="1" />
  <text x="670" y="148" class="sans" font-size="10" font-weight="700" fill="#d1fae5">Algorithms Lab</text>
  <text x="670" y="162" class="mono" font-size="9" fill="#34d399">Lab B-204</text>

  <!-- Bottom Analytics Bar -->
  <rect x="25" y="420" width="750" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="45" y="445" class="mono" font-size="11" fill="#94a3b8">
    <tspan fill="#34d399">● System Optimal</tspan> : 42 Course Sections Scheduled • 0 Room Collisions • Real-Time Matrix Generator
  </text>
  <text x="755" y="445" class="mono" font-size="11" fill="#38bdf8" font-weight="600" text-anchor="end">SQLite Indexed ⚡</text>
</svg>
