  </defs>
  <rect width="64" height="64" rx="16" fill="#090d16" />
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="url(#grad)" stroke-width="1.5" stroke-opacity="0.5" />
  <text x="32" y="42" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="url(#grad)" text-anchor="middle" filter="url(#glow)">&lt;K/&gt;</text>
</svg>
