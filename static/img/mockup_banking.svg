<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0c1426" />
      <stop offset="100%" stop-color="#080e1c" />
    </linearGradient>

    <!-- Card Sheen Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Cyan Accent Glow -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Chart Fill Gradient -->
    <linearGradient id="chartFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0" />
    </linearGradient>

    <!-- Gold Chip Gradient -->
    <linearGradient id="goldChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
  </style>

  <!-- Canvas Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Background Grid Lines -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Ambient Glow Behind Elements -->
  <circle cx="200" cy="220" r="140" fill="#0284c7" opacity="0.12" filter="url(#glow)" />
  <circle cx="600" cy="280" r="160" fill="#7c3aed" opacity="0.10" filter="url(#glow)" />

  <!-- Top Application Navigation Bar -->
  <rect x="25" y="20" width="750" height="48" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="1" />
  <circle cx="48" cy="44" r="5" fill="#ef4444" />
  <circle cx="64" cy="44" r="5" fill="#f59e0b" />
  <circle cx="80" cy="44" r="5" fill="#10b981" />

  <text x="110" y="49" class="sans" font-size="13" font-weight="700" fill="#f8fafc">APEX BANKING</text>
  <text x="210" y="49" class="mono" font-size="11" fill="#64748b">| Full-Stack Core Architecture (Flask + MySQL)</text>

  <!-- Top Right Security Badge -->
  <rect x="580" y="30" width="180" height="28" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
  <circle cx="596" cy="44" r="4" fill="#10b981" />
  <text x="608" y="48" class="mono" font-size="10" font-weight="600" fill="#34d399">256-BIT ENCRYPTION</text>

  <!-- LEFT: Virtual Credit Card Mockup -->
  <g transform="translate(35, 90)" filter="url(#shadow)">
    <!-- Card Body -->
    <rect width="280" height="175" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    
    <!-- Chip -->
    <rect x="25" y="40" width="38" height="28" rx="5" fill="url(#goldChip)" />
    <path d="M 25 54 L 63 54 M 44 40 L 44 68" stroke="#78350f" stroke-width="1" opacity="0.7" />

    <!-- Contactless Icon -->
    <path d="M 80 48 A 12 12 0 0 1 80 60 M 86 44 A 18 18 0 0 1 86 64 M 92 40 A 24 24 0 0 1 92 68" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

    <!-- Card Brand -->
    <text x="255" y="45" class="sans" font-size="14" font-weight="800" fill="#ffffff" text-anchor="end" opacity="0.9">VISA</text>
    <text x="255" y="58" class="mono" font-size="8" fill="#93c5fd" text-anchor="end">PLATINUM</text>

    <!-- Card Number -->
    <text x="25" y="112" class="mono" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="2">••••  ••••  ••••  8842</text>

    <!-- Card Holder & Expiry -->
    <text x="25" y="140" class="mono" font-size="8" fill="#93c5fd">CARDHOLDER</text>
    <text x="25" y="154" class="sans" font-size="12" font-weight="700" fill="#ffffff">KIDUS TIGISTU</text>

    <text x="210" y="140" class="mono" font-size="8" fill="#93c5fd">EXPIRES</text>
    <text x="210" y="154" class="mono" font-size="12" font-weight="600" fill="#ffffff">09/29</text>
  </g>

  <!-- LEFT BOTTOM: Account Quick Action Buttons -->
  <g transform="translate(35, 290)">
    <rect width="280" height="155" rx="10" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b" stroke-width="1" />
    <text x="18" y="28" class="sans" font-size="12" font-weight="700" fill="#94a3b8">QUICK ACTIONS</text>

    <!-- Action 1: Send Money -->
    <rect x="18" y="44" width="115" height="42" rx="6" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1" />
    <text x="42" y="69" class="sans" font-size="11" font-weight="600" fill="#38bdf8">Transfer</text>

    <!-- Action 2: Statement -->
    <rect x="145" y="44" width="115" height="42" rx="6" fill="#334155" fill-opacity="0.4" stroke="#475569" stroke-width="1" />
    <text x="175" y="69" class="sans" font-size="11" font-weight="600" fill="#cbd5e1">Statement</text>

    <!-- Status Audit Tag -->
    <rect x="18" y="100" width="242" height="38" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="1" />
    <circle cx="34" cy="119" r="4" fill="#10b981" />
    <text x="48" y="123" class="mono" font-size="10" fill="#94a3b8">MySQL ACID Safe • SHA-256 Auth</text>
  </g>

  <!-- CENTER/RIGHT TOP: Balance & Sparkline Analytics Card -->
  <g transform="translate(340, 90)">
    <rect width="425" height="175" rx="12" fill="#0f172a" fill-opacity="0.75" stroke="#1e293b" stroke-width="1" filter="url(#shadow)" />

    <text x="25" y="32" class="mono" font-size="11" fill="#64748b">PRIMARY CHECKING ACCOUNT</text>
    <text x="25" y="68" class="sans" font-size="28" font-weight="800" fill="#f8fafc">$28,450.00</text>

    <rect x="195" y="48" width="85" height="24" rx="12" fill="#10b981" fill-opacity="0.15" />
    <text x="207" y="64" class="sans" font-size="11" font-weight="700" fill="#34d399">▲ +14.2%</text>

    <!-- Chart Grid Lines -->
    <line x1="25" y1="95" x2="400" y2="95" stroke="#1e293b" stroke-width="1" />
    <line x1="25" y1="125" x2="400" y2="125" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="25" y1="155" x2="400" y2="155" stroke="#1e293b" stroke-width="1" />

    <!-- Sparkline Area Fill -->
    <path d="M 25 150 Q 80 135, 120 140 T 200 110 T 280 125 T 340 98 T 400 90 L 400 155 L 25 155 Z" fill="url(#chartFill)" />

    <!-- Glowing Sparkline Path -->
    <path d="M 25 150 Q 80 135, 120 140 T 200 110 T 280 125 T 340 98 T 400 90" fill="none" stroke="url(#cyanGrad)" stroke-width="3" filter="url(#glow)" />

    <!-- Active Data Point -->
    <circle cx="400" cy="90" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- CENTER/RIGHT BOTTOM: Recent Ledger Transactions Table -->
  <g transform="translate(340, 280)">
    <rect width="425" height="165" rx="12" fill="#0f172a" fill-opacity="0.75" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="28" class="sans" font-size="12" font-weight="700" fill="#94a3b8">REAL-TIME TRANSACTION LEDGER</text>
    <text x="405" y="28" class="mono" font-size="10" fill="#06b6d4" text-anchor="end">LIVE FEED ●</text>

    <!-- Row 1 -->
    <line x1="20" y1="42" x2="405" y2="42" stroke="#1e293b" stroke-width="1" />
    <circle cx="34" cy="58" r="10" fill="#10b981" fill-opacity="0.15" />
    <text x="34" y="62" class="mono" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">↓</text>
    <text x="55" y="58" class="sans" font-size="12" font-weight="600" fill="#e2e8f0">Client Project Wire</text>
    <text x="55" y="70" class="mono" font-size="9" fill="#64748b">TxID #TX-90412 • Complete</text>
    <text x="405" y="64" class="mono" font-size="12" font-weight="700" fill="#34d399" text-anchor="end">+$3,450.00</text>

    <!-- Row 2 -->
    <line x1="20" y1="82" x2="405" y2="82" stroke="#1e293b" stroke-width="1" />
    <circle cx="34" cy="98" r="10" fill="#ef4444" fill-opacity="0.15" />
    <text x="34" y="102" class="mono" font-size="11" font-weight="700" fill="#f87171" text-anchor="middle">↑</text>
    <text x="55" y="98" class="sans" font-size="12" font-weight="600" fill="#e2e8f0">Cloud VPS Hosting</text>
    <text x="55" y="110" class="mono" font-size="9" fill="#64748b">TxID #TX-90411 • Automated</text>
    <text x="405" y="104" class="mono" font-size="12" font-weight="700" fill="#f87171" text-anchor="end">-$129.00</text>

    <!-- Row 3 -->
    <line x1="20" y1="122" x2="405" y2="122" stroke="#1e293b" stroke-width="1" />
    <circle cx="34" cy="138" r="10" fill="#10b981" fill-opacity="0.15" />
    <text x="34" y="142" class="mono" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">↓</text>
    <text x="55" y="138" class="sans" font-size="12" font-weight="600" fill="#e2e8f0">Stripe Developer Payout</text>
    <text x="55" y="150" class="mono" font-size="9" fill="#64748b">TxID #TX-90410 • Complete</text>
    <text x="405" y="144" class="mono" font-size="12" font-weight="700" fill="#34d399" text-anchor="end">+$850.00</text>
  </g>
</svg>
